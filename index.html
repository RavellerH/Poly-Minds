<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Polymarket Pulse</title>
  <meta name="description" content="Narrative-first dashboard for AI, Crypto, Hyperliquid, Politics, Sports, and Finance prediction markets." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-[#06080d] text-slate-200 min-h-screen text-sm">

  <!-- Ticker tape -->
  <div class="bg-black border-b border-[#1a1f2b] overflow-hidden whitespace-nowrap h-7 flex items-center">
    <div id="ticker-track" class="ticker-track font-mono text-xs text-slate-400 flex items-center gap-8 pl-4">
      <span>Loading ticker&hellip;</span>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-[#1a1f2b] bg-[#0a0d14]/90 sticky top-0 z-10 backdrop-blur">
    <div class="max-w-[1400px] mx-auto px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <h1 class="text-base font-semibold text-white tracking-tight">POLYMARKET <span class="text-emerald-400">PULSE</span></h1>
        <span id="stale-badge" class="hidden text-xs px-2 py-0.5 rounded border border-amber-700/50 bg-amber-950/60 text-amber-400 font-mono">
          &#9888; CACHED
        </span>
      </div>
      <div class="flex items-center gap-3 text-xs text-slate-500 font-mono">
        <span id="refresh-spinner" class="hidden"></span>
        <span id="last-updated">loading...</span>
      </div>
    </div>
    <nav class="max-w-[1400px] mx-auto px-4 pb-2 flex gap-1 overflow-x-auto">
      <button data-category-tab="ai" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">AI &amp; TECH</button>
      <button data-category-tab="crypto" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">CRYPTO</button>
      <button data-category-tab="hyperliquid" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">HYPERLIQUID</button>
      <button data-category-tab="finance" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">FINANCE</button>
      <button data-category-tab="politics" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">POLITICS</button>
      <button data-category-tab="sports" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">SPORTS</button>
      <button data-category-tab="culture" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">POP CULTURE</button>
      <button data-category-tab="science" class="px-2.5 py-1 rounded text-xs font-medium text-slate-400 hover:text-white hover:bg-[#141925] transition-colors whitespace-nowrap">SCIENCE</button>
      <button data-category-tab="trending" class="px-2.5 py-1 rounded text-xs font-medium bg-emerald-600 text-black transition-colors whitespace-nowrap">TRENDING</button>
    </nav>
  </header>

  <!-- Divergence alert strip -->
  <div id="divergence-strip" class="hidden bg-amber-950/40 text-amber-400 text-xs font-mono px-4 py-1.5 border-b border-amber-800/40"></div>

  <main class="max-w-[1400px] mx-auto px-4 py-4 flex flex-col gap-4">

    <!-- Pulse score bar -->
    <section id="pulse-bar" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2"></section>

    <!-- Narrative summary + calibration -->
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_280px] gap-3">
      <div class="rounded border border-[#1a1f2b] bg-[#0a0d14] p-3">
        <h2 class="text-xs font-mono font-medium text-slate-500 mb-1.5 tracking-wide">NARRATIVE SUMMARY</h2>
        <p id="narrative-summary" class="text-sm text-slate-300 leading-relaxed">Loading market narrative...</p>
      </div>
      <div class="rounded border border-[#1a1f2b] bg-[#0a0d14] p-3">
        <h2 class="text-xs font-mono font-medium text-slate-500 mb-1.5 tracking-wide">TRACK RECORD</h2>
        <div id="calibration-panel" class="text-sm text-slate-400">Checking recently resolved markets...</div>
      </div>
    </section>

    <!-- Main content: market grid + news sidebar -->
    <section class="grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-4">
      <div id="market-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-2 content-start"></div>

      <aside class="rounded border border-[#1a1f2b] bg-[#0a0d14] p-3 h-fit">
        <h2 class="text-xs font-mono font-medium text-slate-500 mb-2 tracking-wide">NEWS FEED</h2>
        <div id="news-feed"></div>
      </aside>
    </section>
  </main>

  <footer class="max-w-[1400px] mx-auto px-4 py-5 text-xs text-slate-600 font-mono">
    DATA: POLYMARKET GAMMA/CLOB API &middot; RSS VIA RSS2JSON &middot; NO TRADING, NO WALLET, NO BACKEND.
  </footer>

  <script src="js/config.js"></script>
  <script src="js/cache.js"></script>
  <script src="js/polymarket.js"></script>
  <script src="js/news.js"></script>
  <script src="js/narrative.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
